[package]
name = "nova-notes"
version = "0.2.0"
description = "A little space to think"
edition = "2021"

[lib]
name = "nova_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dotenvy = "0.15"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
blake3 = "1"
tempfile = "3"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
base64 = "0.22"
rand = "0.8"
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
notify = "8.2"
tauri-plugin-updater = "2"
window-vibrancy = "0.6"
whisper-rs = "0.16"
cpal = "0.16"
portable-pty = "0.9"
webbrowser = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSView", "NSWindow", "NSVisualEffectView", "NSUserInterfaceItemIdentification"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSArray", "NSGeometry"] }

[dev-dependencies]
hound = "3"

# Backport iOS scene lifecycle fixes while the Tauri 2 dependency pins Tao 0.35.
[patch.crates-io]
tao = { path = "vendor/tao" }

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-nova-auth = { path = "plugins/ios-auth" }
