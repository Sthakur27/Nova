name: Desktop installers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: mac-apple-silicon
            bundle: dmg/*.dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            label: mac-intel
            bundle: dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundle: nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}-native-bindings-v2
      - name: Check CMake
        run: cmake --version
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run package -- --target ${{ matrix.target }}
      - name: Verify packaged Mac signature
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/verify-macos-installer.sh src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Nova-${{ matrix.label }}-${{ github.sha }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 14
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Nova-*-${{ github.sha }}
          path: installers
      - name: Prepare downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          for platform in mac-apple-silicon mac-intel windows-x64; do
            extension=dmg
            if [[ "$platform" == windows-x64 ]]; then extension=exe; fi
            mapfile -t files < <(find "installers/Nova-${platform}-${GITHUB_SHA}" -type f -name "*.${extension}")
            if [[ ${#files[@]} -ne 1 ]]; then
              echo "Expected exactly one installer for ${platform}, found ${#files[@]}"
              exit 1
            fi
            cp "${files[0]}" "release/Nova-${platform}.${extension}"
          done
          (cd release && sha256sum Nova-* > SHA256SUMS.txt)
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.md <<'EOF'
          Download the installer for your computer below. No developer tools or GitHub account are required.

          - **Mac (Apple Silicon):** `Nova-mac-apple-silicon.dmg`
          - **Mac (Intel):** `Nova-mac-intel.dmg`
          - **Windows (x64):** `Nova-windows-x64.exe`

          Nova is free. No developer tools or paid accounts are needed.

          **Mac:** open the DMG, drag Nova into **Applications**, then open it from there. If blocked, try **System Settings → Privacy & Security → Open Anyway** if available.

          If macOS says **“Nova is damaged”** or still blocks it, click **Cancel**, open **Terminal** (⌘ Space, then type Terminal), paste this command and press Return:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/Nova.app"
          ```

          Open Nova again. Only do this for Nova from this repository's official downloads. It removes the download restriction for Nova alone; a new download may need this again. Mac builds are ad-hoc signed, but aren't Apple-notarized.

          **Windows:** run the EXE installer. Windows builds aren't publisher-signed and may show a security warning.

          Voice typing downloads its model on first use.
          EOF
          printf '\nBuilt from commit `%s`.\n' "$GITHUB_SHA" >> release-notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "Nova · $(date -u +%Y-%m-%d) · ${GITHUB_SHA:0:7}" --notes-file release-notes.md --draft
          gh release upload "$tag" release/*
          gh release edit "$tag" --draft=false --latest
